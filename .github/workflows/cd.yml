name: Publish to npm

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Extract package info
        id: pkg
        run: |
          NAME=$(node -e "console.log(require('./package.json').name)")
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $NAME@$VERSION"

      - name: Version guard
        run: |
          if git rev-parse "v${{ steps.pkg.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.pkg.outputs.version }} already exists. Bump the version first."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          # Publish on Active LTS (24). ci.yml's matrix verifies that the
          # tarball still runs on Maintenance LTS (22) for downstream
          # consumers until its EOL (April 2027).
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Publish with provenance
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        # Pinned to the v3.0.0 commit SHA (not the floating @v3 tag). The
        # May 2026 TanStack incident showed valid SLSA provenance can be
        # issued for hijacked workflow runs — pinning third-party actions
        # to SHAs is the cheapest defense against tag-rewrite supply-chain
        # attacks. Dependabot's github-actions group will open SHA-bump
        # PRs as new releases land. Update the trailing comment in lockstep.
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
