name: CodeQL
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
  security-events: write
jobs:
  codeql:
    uses: starter-series/.github/.github/workflows/reusable-codeql.yml@main
    with:
      language: javascript-typescript
  analyze:
    needs: codeql
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
    - uses: starter-series/.github/.github/actions/require-checks@main
      with:
        results: ${{ toJSON(needs) }}
