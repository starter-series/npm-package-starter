name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  meta:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      update-type: ${{ steps.meta.outputs.update-type }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Label major updates for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: gh pr edit "$PR_URL" --add-label "dependencies,manual-review"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Run the full CI pipeline in-run so the bump cannot merge unless CI is green.
  # This does not rely on branch protection being configured on the consumer repo
  # (a fresh template has none, which would make `--auto` merge immediately).
  call-ci:
    needs: meta
    if: |
      needs.meta.outputs.update-type == 'version-update:semver-patch' ||
      needs.meta.outputs.update-type == 'version-update:semver-minor'
    uses: ./.github/workflows/ci.yml

  # Enable auto-merge only after CI has passed for this PR. `needs: [call-ci]`
  # means a failed CI run blocks this job, so the merge never happens on red CI.
  auto-merge:
    needs: [meta, call-ci]
    if: |
      needs.meta.outputs.update-type == 'version-update:semver-patch' ||
      needs.meta.outputs.update-type == 'version-update:semver-minor'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for minor/patch updates
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
