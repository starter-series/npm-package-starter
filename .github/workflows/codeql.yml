# CodeQL — advanced setup (not default setup).
#
# Why advanced: this file is visible to anyone cloning the starter, so
# they can see exactly which queries run and on what schedule. Default
# setup hides the workflow behind a UI toggle and is less discoverable
# for downstream maintainers. The trade-off is that we own version
# bumps (Dependabot's github-actions group handles them weekly).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Every Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
